# docker compose up -d --build
# Requires a .env file next to this one (copy .env.example). PASSWORD_PEPPER is mandatory.
services:
  api:
    build: .
    command: ["sh", "-c", "uvicorn api:app --host 0.0.0.0 --port 8000 --workers 1"]
    env_file: .env
    environment:
      APP_ENV: production
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in .env (see .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    env_file: .env
    environment:
      APP_ENV: production
      API_BASE_URL: http://api:8000
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:?Set PASSWORD_PEPPER in .env (see .env.example)}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  app_data:
